# Stage 2: https, with port 80 kept only for ACME renewals and a redirect.
limit_req_zone $binary_remote_addr zone=bd_work_login:1m rate=10r/m;

server {
    listen      80;
    listen      [::]:80;
    server_name server.idsservices.us;

    # Renewals run over http; must not redirect.
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://server.idsservices.us$request_uri; }
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name server.idsservices.us;

    ssl_certificate     /etc/letsencrypt/live/server.idsservices.us/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/server.idsservices.us/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:bd_work_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=15552000" always;

    include snippets/bd-work-proxy.conf;
}
